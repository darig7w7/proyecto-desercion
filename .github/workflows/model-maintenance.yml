name: Model Maintenance - Student Dropout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    name: Mantenimiento del modelo
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas antes del mantenimiento
        run: |
          python -m pytest -v

      - name: Ejecutar pipeline de mantenimiento
        run: |
          python -m maintenance.pipeline

      - name: Consultar decisión de promoción
        id: promotion
        shell: bash
        run: |
          STATUS=$(python - <<'PY'
          import json

          with open(
              "models/registry/v1.1.0/metadata.json",
              "r",
              encoding="utf-8",
          ) as f:
              metadata = json.load(f)

          print(metadata["status"])
          PY
          )

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Estado del candidato: $STATUS"

      - name: Activar candidato aprobado
        if: steps.promotion.outputs.status == 'approved'
        run: |
          python -m maintenance.activate v1.1.0

      - name: Ejecutar pruebas después de la activación
        if: steps.promotion.outputs.status == 'approved'
        run: |
          python -m pytest -v

      - name: Persistir modelo aprobado
        if: steps.promotion.outputs.status == 'approved'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f models/modelo_desercion.pkl
          git add -f models/columnas.pkl
          git add models/registry/production.json
          git add models/registry/v1.1.0/metadata.json

          if git diff --cached --quiet; then
            echo "No existen cambios de producción para persistir."
          else
            git commit -m "Desplegar modelo aprobado v1.1.0"
            git push origin HEAD:main
          fi

      - name: Candidato rechazado
        if: steps.promotion.outputs.status != 'approved'
        run: |
          echo "El candidato no cumple la política de promoción."
          echo "No se modifica el modelo activo."
          echo "Se mantiene la versión actual de producción."

      - name: Mostrar resultado del mantenimiento
        if: always()
        run: |
          echo "===== MODELO CANDIDATO ====="
          cat models/registry/v1.1.0/metadata.json

          echo ""
          echo "===== MODELO EN PRODUCCION ====="
          cat models/registry/production.json

      - name: Guardar evidencia del mantenimiento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-mantenimiento-modelo
          path: |
            models/registry/production.json
            models/registry/v1.0.0-baseline/metadata.json
            models/registry/v1.1.0/metadata.json
          retention-days: 30
